services:


  elements-esplora:
    build: ./esplora
    environment:
      - "DEBUG=VERBOSE"
      - "NO_REGTEST_MINING=1"
    volumes:
      - elements-esplora-data:/data
    command:
      - liquid-regtest
      - explorer
    ports:
      - "8092:80"      
    networks:
      elements-net:
        ipv4_address: 172.16.231.13

        
volumes:
  bitcoind-data:
  elementsd-data:
  bitcoin-esplora-data:
  elements-esplora-data:
  elementsd-1-data:    
    
networks:
  elements-net:
    ipam:
     config:
       - subnet: 172.16.231.0/24
